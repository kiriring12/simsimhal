<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer - Hisaishi Joe</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      font-family: 'Pretendard', -apple-system, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; color: #2c3e50;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      padding: 40px 32px; border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      text-align: center; max-width: 400px; width: 90%;
    }
    h1 { margin: 0 0 8px 0; font-size: 1.9rem; font-weight: 700; }
    p { color: #666; font-size: 0.95rem; margin: 0 0 28px 0; }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .btn {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      border: none; color: white; padding: 14px 36px;
      font-size: 1.05rem; font-weight: 600; border-radius: 30px;
      cursor: pointer; transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(37, 117, 252, 0.35); width: 100%;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37, 117, 252, 0.5); }
    .volume-box {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      background: rgba(0, 0, 0, 0.04); padding: 12px 18px; border-radius: 16px;
    }
    .volume-box label { font-size: 0.85rem; font-weight: 600; color: #555; }
    .volume-box input[type="range"] { width: 65%; accent-color: #2575fc; cursor: pointer; }
    .visualizer { display: flex; justify-content: center; align-items: flex-end; gap: 6px; height: 40px; margin-top: 24px; }
    .bar { width: 7px; height: 8px; background-color: #2575fc; border-radius: 4px; transition: height 0.12s ease; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Summer</h1>
    <p>Joe Hisaishi Piano Cover</p>
    
    <div class="controls">
      <button id="playBtn" class="btn">▶ 연주 시작</button>
      
      <div class="volume-box">
        <label for="volumeSlider">🔊 볼륨</label>
        <input type="range" id="volumeSlider" min="-30" max="6" value="-4" step="1">
      </div>
    </div>
    
    <div class="visualizer">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </div>

  <script>
    const reverb = new Tone.Reverb({ decay: 2.5, wet: 0.3 }).toDestination();
    
    const synth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.008, decay: 0.35, sustain: 0.2, release: 1.0 }
    }).connect(reverb);

    Tone.Destination.volume.value = -4;

    // 오른손 멜로디 (마디 5부터 멜로디 시작)
    const rightHand = [
      // 5마디 (00:18 부근)
      { time: "4:0:0", note: "E5", duration: "8n" },
      { time: "4:0:2", note: "F#5", duration: "16n." },
      { time: "4:1:1", note: "E5", duration: "16n" },
      { time: "4:2:0", note: "C#5", duration: "8n." },
      { time: "4:3:1", note: "A4", duration: "16n" },
      
      // 6마디
      { time: "5:0:0", note: "B4", duration: "2n." },
      { time: "5:3:0", note: "A4", duration: "8n" },
      { time: "5:3:2", note: "B4", duration: "8n" },
      
      // 7마디
      { time: "6:0:0", note: "C#5", duration: "8n" },
      { time: "6:0:2", note: "D5", duration: "16n." },
      { time: "6:1:1", note: "C#5", duration: "16n" },
      { time: "6:2:0", note: "A4", duration: "8n." },
      { time: "6:3:1", note: "F#4", duration: "16n" },
      
      // 8마디
      { time: "7:0:0", note: "E4", duration: "2n." },
      { time: "7:3:0", note: "A4", duration: "8n" },
      { time: "7:3:2", note: "B4", duration: "8n" },
      
      // 9마디
      { time: "8:0:0", note: "E5", duration: "8n" },
      { time: "8:0:2", note: "F#5", duration: "16n." },
      { time: "8:1:1", note: "E5", duration: "16n" },
      { time: "8:2:0", note: "C#5", duration: "8n." },
      { time: "8:3:1", note: "A4", duration: "16n" },
      
      // 10마디
      { time: "9:0:0", note: "B4", duration: "2n." },
      { time: "9:3:0", note: "A4", duration: "8n" },
      { time: "9:3:2", note: "B4", duration: "8n" },
      
      // 11마디
      { time: "10:0:0", note: "C#5", duration: "8n" },
      { time: "10:0:2", note: "D5", duration: "16n." },
      { time: "10:1:1", note: "C#5", duration: "16n" },
      { time: "10:2:0", note: "A4", duration: "8n." },
      { time: "10:3:1", note: "C#5", duration: "16n" },
      
      // 12마디
      { time: "11:0:0", note: "A4", duration: "1m" }
    ];

    // 왼손 아르페지오 생성
    function createArpeggio(m, type) {
      const beats = ["0:0", "0:2", "1:0", "2:0", "2:2", "3:0"];
      let notes = [];
      if (type === 'A') notes = ["A2", "E3", "A3", "C#4", "A3", "E3"];
      if (type === 'D') notes = ["D2", "A2", "D3", "F#3", "D3", "A2"];
      if (type === 'E') notes = ["E2", "B2", "E3", "G#3", "E3", "B2"];

      return beats.map((b, i) => ({
        time: `${m}:${b}`,
        note: notes[i],
        duration: "8n"
      }));
    }

    const leftHand = [
      ...createArpeggio(0, 'A'), ...createArpeggio(1, 'D'), ...createArpeggio(2, 'E'), ...createArpeggio(3, 'A'),
      ...createArpeggio(4, 'A'), ...createArpeggio(5, 'D'), ...createArpeggio(6, 'E'), ...createArpeggio(7, 'A'),
      ...createArpeggio(8, 'A'), ...createArpeggio(9, 'D'), ...createArpeggio(10, 'E'), ...createArpeggio(11, 'A')
    ];

    let isPlaying = false;
    const playBtn = document.getElementById("playBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const bars = document.querySelectorAll(".bar");

    volumeSlider.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      if (val === -30) {
        Tone.Destination.mute = true;
      } else {
        Tone.Destination.mute = false;
        Tone.Destination.volume.value = val;
      }
    });

    function animateVisualizer() {
      if (!isPlaying) {
        bars.forEach(bar => bar.style.height = "8px");
        return;
      }
      bars.forEach(bar => {
        const randomHeight = Math.floor(Math.random() * 32) + 8;
        bar.style.height = randomHeight + "px";
      });
      setTimeout(animateVisualizer, 100);
    }

    const score = [
      ...rightHand.map(e => ({ ...e, velocity: 0.9 })),
      ...leftHand.map(e => ({ ...e, velocity: 0.55 }))
    ];

    const part = new Tone.Part((time, event) => {
      synth.triggerAttackRelease(event.note, event.duration, time, event.velocity);
    }, score);

    part.loop = true;
    part.loopEnd = "12:0:0"; 
    Tone.Transport.bpm.value = 112; 

    playBtn.addEventListener("click", async () => {
      await Tone.start();

      if (!isPlaying) {
        Tone.Transport.start();
        part.start(0);
        isPlaying = true;
        playBtn.innerText = "❚❚ 일시정지";
        animateVisualizer();
      } else {
        Tone.Transport.stop();
        isPlaying = false;
        playBtn.innerText = "▶ 연주 시작";
      }
    });
  </script>
</body>
</html>
