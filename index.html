<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer - Hisaishi Joe</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      font-family: 'Pretendard', -apple-system, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; color: #2c3e50;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      padding: 40px 32px; border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      text-align: center; max-width: 400px; width: 90%;
    }
    h1 { margin: 0 0 8px 0; font-size: 1.9rem; font-weight: 700; }
    p { color: #666; font-size: 0.95rem; margin: 0 0 28px 0; }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .btn {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      border: none; color: white; padding: 14px 36px;
      font-size: 1.05rem; font-weight: 600; border-radius: 30px;
      cursor: pointer; transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.35); width: 100%;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(79, 172, 254, 0.5); }
    .volume-box {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      background: rgba(0, 0, 0, 0.04); padding: 12px 18px; border-radius: 16px;
    }
    .volume-box label { font-size: 0.85rem; font-weight: 600; color: #555; }
    .volume-box input[type="range"] { width: 65%; accent-color: #4facfe; cursor: pointer; }
    .visualizer { display: flex; justify-content: center; align-items: flex-end; gap: 6px; height: 40px; margin-top: 24px; }
    .bar { width: 7px; height: 8px; background-color: #4facfe; border-radius: 4px; transition: height 0.12s ease; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Summer</h1>
    <p>Joe Hisaishi.</p>
    
    <div class="controls">
      <button id="playBtn" class="btn">▶ 연주 시작</button>
      
      <div class="volume-box">
        <label for="volumeSlider">🔊 볼륨</label>
        <input type="range" id="volumeSlider" min="-30" max="6" value="-4" step="1">
      </div>
    </div>
    
    <div class="visualizer">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </div>

  <script>
    // 울림(공간감) 이펙트
    const reverb = new Tone.Reverb({ decay: 2.2, wet: 0.25 }).toDestination();
    
    const synth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.01, decay: 0.35, sustain: 0.25, release: 1.2 }
    }).connect(reverb);

    Tone.Destination.volume.value = -4;

    // 오른손 (D 메이저 키)
    // 인트로(1~4마디) 피치카토 느낌의 오프닝 후 5마디부터 멜로디 진입
    const rightHand = [
      // 인트로 3음 튀김 패턴 (F#5 - G5 - A5 / F#5 - G5 - A5 ...)
      { time: "0:0:0", note: "F#5", duration: "16n" }, { time: "0:0:1", note: "G5", duration: "16n" }, { time: "0:0:2", note: "A5", duration: "8n" },
      { time: "0:1:0", note: "F#5", duration: "16n" }, { time: "0:1:1", note: "G5", duration: "16n" }, { time: "0:1:2", note: "A5", duration: "8n" },
      { time: "0:2:0", note: "F#5", duration: "16n" }, { time: "0:2:1", note: "G5", duration: "16n" }, { time: "0:2:2", note: "A5", duration: "8n" },
      { time: "0:3:0", note: "F#5", duration: "16n" }, { time: "0:3:1", note: "G5", duration: "16n" }, { time: "0:3:2", note: "A5", duration: "8n" },

      { time: "1:0:0", note: "F#5", duration: "16n" }, { time: "1:0:1", note: "G5", duration: "16n" }, { time: "1:0:2", note: "A5", duration: "8n" },
      { time: "1:1:0", note: "F#5", duration: "16n" }, { time: "1:1:1", note: "G5", duration: "16n" }, { time: "1:1:2", note: "A5", duration: "8n" },
      { time: "1:2:0", note: "F#5", duration: "16n" }, { time: "1:2:1", note: "G5", duration: "16n" }, { time: "1:2:2", note: "A5", duration: "8n" },
      { time: "1:3:0", note: "F#5", duration: "16n" }, { time: "1:3:1", note: "G5", duration: "16n" }, { time: "1:3:2", note: "A5", duration: "8n" },

      // 메인 테마 멜로디 
      // 5마디: (라) - 레 - 미 - 파# - 미 - 레 - 미
      { time: "4:0:0", note: "A4", duration: "8n" },
      { time: "4:0:2", note: "D5", duration: "8n" },
      { time: "4:1:0", note: "E5", duration: "8n" },
      { time: "4:1:2", note: "F#5", duration: "8n" },
      { time: "4:2:0", note: "E5", duration: "8n" },
      { time: "4:2:2", note: "D5", duration: "8n" },
      { time: "4:3:0", note: "E5", duration: "4n" },

      // 6마디: 파# - 파# - 파# - 미 - 레 - 미
      { time: "5:0:0", note: "F#5", duration: "8n." },
      { time: "5:1:0", note: "F#5", duration: "8n" },
      { time: "5:1:2", note: "F#5", duration: "8n" },
      { time: "5:2:0", note: "E5", duration: "8n" },
      { time: "5:2:2", note: "D5", duration: "8n" },
      { time: "5:3:0", note: "E5", duration: "4n" },

      // 7마디: 레 - 미 - 파# - 미 - 레 - 시 - 라
      { time: "6:0:0", note: "D5", duration: "8n" },
      { time: "6:0:2", note: "E5", duration: "8n" },
      { time: "6:1:0", note: "F#5", duration: "8n" },
      { time: "6:1:2", note: "E5", duration: "8n" },
      { time: "6:2:0", note: "D5", duration: "8n" },
      { time: "6:2:2", note: "B4", duration: "8n" },
      { time: "6:3:0", note: "A4", duration: "4n" },

      // 8마디: (라) - 레 - 미 - 파#
      { time: "7:0:0", note: "A4", duration: "8n" },
      { time: "7:0:2", note: "D5", duration: "8n" },
      { time: "7:1:0", note: "E5", duration: "8n" },
      { time: "7:1:2", note: "F#5", duration: "2n" },

      // 9~12마디 반복 테마
      { time: "8:0:0", note: "A4", duration: "8n" },
      { time: "8:0:2", note: "D5", duration: "8n" },
      { time: "8:1:0", note: "E5", duration: "8n" },
      { time: "8:1:2", note: "F#5", duration: "8n" },
      { time: "8:2:0", note: "E5", duration: "8n" },
      { time: "8:2:2", note: "D5", duration: "8n" },
      { time: "8:3:0", note: "E5", duration: "4n" },

      { time: "9:0:0", note: "F#5", duration: "8n." },
      { time: "9:1:0", note: "F#5", duration: "8n" },
      { time: "9:1:2", note: "F#5", duration: "8n" },
      { time: "9:2:0", note: "E5", duration: "8n" },
      { time: "9:2:2", note: "D5", duration: "8n" },
      { time: "9:3:0", note: "E5", duration: "4n" },

      { time: "10:0:0", note: "D5", duration: "8n" },
      { time: "10:0:2", note: "E5", duration: "8n" },
      { time: "10:1:0", note: "F#5", duration: "8n" },
      { time: "10:1:2", note: "E5", duration: "8n" },
      { time: "10:2:0", note: "D5", duration: "8n" },
      { time: "10:2:2", note: "B4", duration: "8n" },
      { time: "10:3:0", note: "A4", duration: "4n" },

      { time: "11:0:0", note: "D5", duration: "1m" }
    ];

    // 영상 속 왼손 반주 (Bm - G - A - D 진행)
    function createArpeggio(m, type) {
      const beats = ["0:0", "0:2", "1:0", "2:0", "2:2", "3:0"];
      let notes = [];
      if (type === 'Bm') notes = ["B2", "F#3", "B3", "D4", "B3", "F#3"];
      if (type === 'G')  notes = ["G2", "D3", "G3", "B3", "G3", "D3"];
      if (type === 'A')  notes = ["A2", "E3", "A3", "C#4", "A3", "E3"];
      if (type === 'D')  notes = ["D2", "A2", "D3", "F#3", "D3", "A2"];

      return beats.map((b, i) => ({
        time: `${m}:${b}`,
        note: notes[i],
        duration: "8n"
      }));
    }

    const leftHand = [
      ...createArpeggio(0, 'Bm'), ...createArpeggio(1, 'G'), ...createArpeggio(2, 'A'), ...createArpeggio(3, 'D'),
      ...createArpeggio(4, 'Bm'), ...createArpeggio(5, 'G'), ...createArpeggio(6, 'A'), ...createArpeggio(7, 'D'),
      ...createArpeggio(8, 'Bm'), ...createArpeggio(9, 'G'), ...createArpeggio(10, 'A'), ...createArpeggio(11, 'D')
    ];

    let isPlaying = false;
    const playBtn = document.getElementById("playBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const bars = document.querySelectorAll(".bar");

    volumeSlider.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      if (val === -30) {
        Tone.Destination.mute = true;
      } else {
        Tone.Destination.mute = false;
        Tone.Destination.volume.value = val;
      }
    });

    function animateVisualizer() {
      if (!isPlaying) {
        bars.forEach(bar => bar.style.height = "8px");
        return;
      }
      bars.forEach(bar => {
        const randomHeight = Math.floor(Math.random() * 32) + 8;
        bar.style.height = randomHeight + "px";
      });
      setTimeout(animateVisualizer, 100);
    }

    const score = [
      ...rightHand.map(e => ({ ...e, velocity: 0.9 })),
      ...leftHand.map(e => ({ ...e, velocity: 0.55 }))
    ];

    const part = new Tone.Part((time, event) => {
      synth.triggerAttackRelease(event.note, event.duration, time, event.velocity);
    }, score);

    part.loop = true;
    part.loopEnd = "12:0:0"; 
    Tone.Transport.bpm.value = 115; // 핑크피아노 원곡 템포

    playBtn.addEventListener("click", async () => {
      await Tone.start();

      if (!isPlaying) {
        Tone.Transport.start();
        part.start(0);
        isPlaying = true;
        playBtn.innerText = "❚❚ 일시정지";
        animateVisualizer();
      } else {
        Tone.Transport.stop();
        isPlaying = false;
        playBtn.innerText = "▶ 연주 시작";
      }
    });
  </script>
</body>
</html>
