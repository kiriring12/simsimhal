<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer - Joe Hisaishi</title>
  <!-- Tone.js 오디오 라이브러리 로드 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #2c3e50;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 380px;
      width: 90%;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.8rem;
      font-weight: 700;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      margin: 0 0 28px 0;
    }
    .btn {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      border: none;
      color: white;
      padding: 14px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.35);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(79, 172, 254, 0.5);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 6px;
      height: 45px;
      margin-top: 32px;
    }
    .bar {
      width: 7px;
      height: 8px;
      background-color: #4facfe;
      border-radius: 4px;
      transition: height 0.15s ease;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Summer</h1>
    <p>Joe Hisaishi — 기쿠지로의 여름 OST</p>
    <button id="playBtn" class="btn">▶ 재생하기</button>
    
    <div class="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <script>
    // 1. 신시사이저 음색 설정 (부드러운 피아노 느낌)
    const synth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: {
        attack: 0.02,
        decay: 0.4,
        sustain: 0.3,
        release: 1.2
      }
    }).toDestination();

    // 2. Summer 메인 테마 악보 데이터 (A Major)
    // format: [마디:비트:시작위치]
    const melody = [
      // 1마디
      { time: "0:0:0", note: "A4", duration: "8n" },
      { time: "0:0:2", note: "B4", duration: "8n" },
      { time: "0:1:0", note: "C#5", duration: "8n" },
      { time: "0:1:2", note: "E5", duration: "8n" },
      { time: "0:2:0", note: "C#5", duration: "8n" },
      { time: "0:2:2", note: "B4", duration: "8n" },
      { time: "0:3:0", note: "A4", duration: "8n" },
      { time: "0:3:2", note: "F#4", duration: "8n" },
      
      // 2마디
      { time: "1:0:0", note: "A4", duration: "8n" },
      { time: "1:0:2", note: "B4", duration: "8n" },
      { time: "1:1:0", note: "C#5", duration: "8n" },
      { time: "1:1:2", note: "E5", duration: "8n" },
      { time: "1:2:0", note: "C#5", duration: "4n" },
      { time: "1:3:0", note: "B4", duration: "4n" },

      // 3마디
      { time: "2:0:0", note: "A4", duration: "8n" },
      { time: "2:0:2", note: "B4", duration: "8n" },
      { time: "2:1:0", note: "C#5", duration: "8n" },
      { time: "2:1:2", note: "E5", duration: "8n" },
      { time: "2:2:0", note: "C#5", duration: "8n" },
      { time: "2:2:2", note: "B4", duration: "8n" },
      { time: "2:3:0", note: "A4", duration: "8n" },
      { time: "2:3:2", note: "F#4", duration: "8n" },

      // 4마디
      { time: "3:0:0", note: "A4", duration: "4n" },
      { time: "3:1:0", note: "F#4", duration: "4n" },
      { time: "3:2:0", note: "E4", duration: "2n" }
    ];

    let isPlaying = false;
    const playBtn = document.getElementById("playBtn");
    const bars = document.querySelectorAll(".bar");

    // 비주얼라이저 애니메이션
    function animateVisualizer() {
      if (!isPlaying) {
        bars.forEach(bar => bar.style.height = "8px");
        return;
      }
      bars.forEach(bar => {
        const randomHeight = Math.floor(Math.random() * 35) + 8;
        bar.style.height = randomHeight + "px";
      });
      setTimeout(animateVisualizer, 100);
    }

    // 멜로디 파트 등록 및 자동 반복 설정
    const part = new Tone.Part((time, event) => {
      synth.triggerAttackRelease(event.note, event.duration, time);
    }, melody);

    part.loop = true;
    part.loopEnd = "4:0:0";
    Tone.Transport.bpm.value = 115; // 템포 설정

    // 버튼 클릭 시 오디오 재생/일시정지
    playBtn.addEventListener("click", async () => {
      // 웹 브라우저 오디오 컨텍스트 동의 시작
      await Tone.start();

      if (!isPlaying) {
        Tone.Transport.start();
        part.start(0);
        isPlaying = true;
        playBtn.innerText = "❚❚ 일시정지";
        animateVisualizer();
      } else {
        Tone.Transport.stop();
        isPlaying = false;
        playBtn.innerText = "▶ 재생하기";
      }
    });
  </script>
</body>
</html>
