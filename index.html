<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; color: #ffffff; padding: 20px;
    }
    .container {
      background: #1e1e24;
      padding: 30px 24px; border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center; max-width: 440px; width: 100%;
    }
    h1 { font-size: 1.6rem; margin-bottom: 8px; color: #4facfe; }
    p { font-size: 0.9rem; color: #a0aec0; margin-bottom: 24px; }
    
    /* 채널 선택 버튼 영역 */
    .btn-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-bottom: 20px;
    }
    .channel-btn {
      background: #2a2a36; border: 2px solid #3f3f52;
      color: #ffffff; padding: 12px 8px; font-size: 0.9rem; font-weight: bold;
      border-radius: 12px; cursor: pointer; transition: 0.2s;
    }
    .channel-btn.active {
      background: #0072ff; border-color: #00c6ff;
      box-shadow: 0 0 12px rgba(0, 198, 255, 0.5);
    }

    /* 메인 연주 버튼 */
    .play-btn {
      background: #00b09b; background: linear-gradient(to right, #96c93d, #00b09b);
      border: none; color: #000; padding: 16px; font-size: 1.1rem; font-weight: bold;
      border-radius: 30px; cursor: pointer; width: 100%; margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0, 176, 155, 0.4);
    }
    .play-btn:active { transform: scale(0.98); }

    /* 볼륨 조절 */
    .volume-container {
      display: flex; justify-content: space-between; align-items: center;
      background: #2a2a36; padding: 10px 16px; border-radius: 12px;
    }
    .volume-container label { font-size: 0.85rem; font-weight: bold; }
    .volume-container input { width: 65%; accent-color: #00b09b; }

    .status-box {
      margin-top: 16px; font-size: 0.85rem; color: #00ffcc; font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Summer (피아노 연주기)</h1>
    <p>채널 선택 버튼으로 들어볼 파트를 고르세요</p>

    <!-- 채널 선택 버튼 3개 + 양손 모드 -->
    <div class="btn-grid">
      <button id="btnBoth" class="channel-btn active">🎧 양손 입체 (L/R)</button>
      <button id="btnMono" class="channel-btn">📻 양손 같이 (중앙)</button>
      <button id="btnLeft" class="channel-btn">👈 왼손(베이스)만</button>
      <button id="btnRight" class="channel-btn">👉 오른손(멜로디)만</button>
    </div>

    <!-- 재생 버튼 -->
    <button id="playBtn" class="play-btn">▶ 연주 시작</button>

    <!-- 볼륨 스라이더 -->
    <div class="volume-container">
      <label for="volumeSlider">🔊 볼륨</label>
      <input type="range" id="volumeSlider" min="-30" max="6" value="-4" step="1">
    </div>

    <div id="statusText" class="status-box">🎧 양손 입체 모드 (L: 왼손 / R: 오른손)</div>
  </div>

    const rightPanner = new Tone.Panner(1).toDestination();  // 오른쪽 완전 분리

    const leftSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.01, decay: 0.35, sustain: 0.25, release: 1.0 }
    }).connect(leftPanner);

    const rightSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.01, decay: 0.3, sustain: 0.2, release: 1.0 }

    Tone.Destination.volume.value = -4;

      let result = [];

        const notes = m.split('/');
        const durStr = isStaccato ? `(${defaultDuration},Staccato)` : `(${defaultDuration})`;
        result.push(notes.map(n => `${n.trim()}${durStr}`).join(' / '));
      });
      return result.join(' // ');
    }

    const leftHandScoreText = [
      sec_1_16, sec_17_24, sec_25_32, sec_33_34, sec_35_42,

    // --- 오른손 악보 데이터 ---

8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5&C#5&A4(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&B4(4) / F#5(8) / D5(8) ~ D5(4) / F#5(8) / G5(8) //   A5&C#5&A4(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&D5(4) / F#5(8) / D5(8) ~ D5(4) / D5(8) / E5(8) // F#5&B4&G#4(4) / F#5(8) / F#5(8) ~ F#5(4) / F#5(8) // F#5&B4&G4(4) / B5(4) / B5&E5(8),F#5(8),E5(8)<3> / D5(4) // E5(2) / E5&B4&G4(4) / B4(8) / B4(8) // E5&G4(4) / C#5(4) / G4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / D5(8) ~ D5(2) // ^(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / E5(8) ~ E5(8) / F#5(4) / F#5(8) ~// F#5(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / D5(8) ~ D5(2) // ^(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(8) / D5(8) / E5(8) ~ E5(8) / A5(4) / F#5(8) ~// F#5(2) / F#5&A4(4) / G5&B4(4) // A5&C#5(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&B4(4) / F#5(8) / D5(8) ~ D5(4) / F#5(8) / G5(8) //   A5&C#5(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&D5(4) / F#5(8) / D5(8) ~ D5(4) / D5(8) / E5(8) // F#5&B4&G#4(4) / F#5(8) / F#5(8) ~ F#5(4) / F#5(4) // F#5&B4&G4(2) / B5&E5(8),F#5(8),E5(8)<3> / D5(8) / B4(8) // D5(2) / D6(2) // C#6&C#5(3) / A5&A4(4) // F#5&F#4(2) / D4&B3(4) / F#4(4) // E4&C#4(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(4) / D6&D5(2) // C#6&C#5(3) / A6&A5(4) // B5&F#5&D5(2) / B3(8) / C#4(8) / D4(8) / E4(8) // F#4(8) / G4(8) / E4(4) / A4(8) / D5(8) / E5(8) / F#5(8) // D5(2) / D6(2) // C#6&C#5(3) / A5&A4(4) // F#5&F#4(2) / D4&B3(4) / F#4(4) // E4&C#4(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / D5(8) ~ D5(2) // B4&G4&D4(4d) / A4&D4(8) ~ A4&D4(4) / G4&D4(4) // F#4&E4&D4(1)";

    // --- 이음표 및 박자 완전 수정 파서 ---
    function parseCustomScore(scoreText) {
      const measures = scoreText.split('//');
      let events = [];
      let currentMeasure = 0;

      measures.forEach(mText => {
        const notesRaw = mText.split('/');
        let currentBeatInMeasure = 0;

        notesRaw.forEach(nRaw => {
          let str = nRaw.trim();
          if (!str) return;

          let isTied = false;
          if (str.startsWith('~')) {
            isTied = true;
            str = str.substring(1).trim();
          }

          let isTriplet = false;
          if (str.includes('<3>')) {
            isTriplet = true;
            str = str.replace('<3>', '').trim();
          }

          const subNotes = str.split(',');

          subNotes.forEach(subStr => {
            let itemStr = subStr.trim();
            if (!itemStr) return;

            const match = itemStr.match(/^([^\(]+)\(([^\)]+)\)$/);
            if (!match) return;

            const noteNameRaw = match[1].trim();
            const attrStr = match[2].trim();
            const attrs = attrStr.split(',').map(s => s.trim());
            const durationVal = attrs[0]; 
            const isStaccato = attrs.includes('Staccato');

            let durUnits = 1.0;
            if (durationVal === '1') durUnits = 4.0;
            else if (durationVal === '2') durUnits = 2.0;
            else if (durationVal === '3') durUnits = 3.0;
            else if (durationVal === '4') durUnits = 1.0;
            else if (durationVal === '8') durUnits = 0.5;
            else if (durationVal === '4d') durUnits = 1.5;

            if (isTriplet) {
              durUnits = durUnits * (2 / 3);
            }

            const beatInt = Math.floor(currentBeatInMeasure);
            const beatRem = currentBeatInMeasure - beatInt;
            const sixteenth = Math.round(beatRem * 4);
            const timePosition = `${currentMeasure}:${beatInt}:${sixteenth}`;

            let noteArray = [];
            if (!noteNameRaw.startsWith('^') && !noteNameRaw.startsWith('X')) {
              noteArray = noteNameRaw.split('&').map(s => s.trim());
            }

            let playDuration = durUnits * (60 / 112); 
            if (isStaccato) {
              playDuration = durUnits * 0.45 * (60 / 112);
            }

            // [이음표 처리]: 이전 노트의 박자를 연장시킴
            if (isTied && events.length > 0) {
              events[events.length - 1].duration += playDuration;
            } else if (noteArray.length > 0) {
              events.push({
                time: timePosition,
                notes: noteArray,
                duration: playDuration
              });
            }

            currentBeatInMeasure += durUnits;
          });
        });

        currentMeasure++;
      });

      return events;
    }

    // 데이터 등록
    const leftEvents = parseCustomScore(leftHandScoreText);
    const rightEvents = parseCustomScore(rightHandScoreText);

    const leftPart = new Tone.Part((time, event) => {
      leftSynth.triggerAttackRelease(event.notes, event.duration, time, 0.75);
    }, leftEvents);

    const rightPart = new Tone.Part((time, event) => {
      rightSynth.triggerAttackRelease(event.notes, event.duration, time, 0.85);
    }, rightEvents);

    leftPart.loop = false;
    rightPart.loop = false;
    Tone.Transport.bpm.value = 112;

    // --- 버튼 이벤트 핸들러 ---
    const btnBoth = document.getElementById("btnBoth");
    const btnMono = document.getElementById("btnMono");
    const btnLeft = document.getElementById("btnLeft");
    const btnRight = document.getElementById("btnRight");
    const statusText = document.getElementById("statusText");

    function setBtnActive(activeBtn) {
      [btnBoth, btnMono, btnLeft, btnRight].forEach(b => b.classList.remove("active"));
      activeBtn.classList.add("active");
    }

    btnBoth.addEventListener("click", () => {
      setBtnActive(btnBoth);
      leftPanner.pan.value = -1;
      rightPanner.pan.value = 1;
      leftSynth.volume.value = 0;
      rightSynth.volume.value = 0;
      statusText.innerText = "🎧 양손 입체 모드 (L: 왼손 / R: 오른손)";
    });

    btnMono.addEventListener("click", () => {
      setBtnActive(btnMono);
      leftPanner.pan.value = 0;
      rightPanner.pan.value = 0;
      leftSynth.volume.value = 0;
      rightSynth.volume.value = 0;
      statusText.innerText = "📻 양손 중앙 모드 (구분 없이 같이 출력)";
    });

    btnLeft.addEventListener("click", () => {
      setBtnActive(btnLeft);
      leftPanner.pan.value = -1;
      leftSynth.volume.value = 0;
      rightSynth.volume.value = -100; // 오른손 끄기
      statusText.innerText = "👈 왼손(베이스)만 들리기";
    });

    btnRight.addEventListener("click", () => {
      setBtnActive(btnRight);
      rightPanner.pan.value = 1;
      rightSynth.volume.value = 0;
      leftSynth.volume.value = -100; // 왼손 끄기
      statusText.innerText = "👉 오른손(멜로디)만 들리기";
    });

    // --- 연주 시작/정지 ---
    let isPlaying = false;
    const playBtn = document.getElementById("playBtn");
    const volumeSlider = document.getElementById("volumeSlider");

    volumeSlider.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      if (val === -30) {
        Tone.Destination.mute = true;
      } else {
        Tone.Destination.mute = false;
        Tone.Destination.volume.value = val;
      }
    });

    playBtn.addEventListener("click", async () => {
      await Tone.start();

      if (!isPlaying) {
        Tone.Transport.start();
        leftPart.start(0);
        rightPart.start(0);
        isPlaying = true;
        playBtn.innerText = "❚❚ 일시정지";
      } else {
        Tone.Transport.stop();
        isPlaying = false;
        playBtn.innerText = "▶ 연주 시작";
      }
    });
  </script>
</body>
</html>
