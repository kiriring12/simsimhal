<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117; color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .panel {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 16px; padding: 28px 24px;
      max-width: 480px; width: 100%; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    h1 { color: #58a6ff; font-size: 1.5rem; margin-bottom: 6px; }
    p.desc { font-size: 0.85rem; color: #8b949e; margin-bottom: 20px; }

    .key-guide {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-bottom: 20px;
    }
    .key-box {
      background: #21262d; border: 1px solid #30363d;
      border-radius: 8px; padding: 10px 6px;
    }
    .key-box .key {
      display: inline-block; background: #30363d; color: #f0f6fc;
      font-weight: bold; padding: 2px 8px; border-radius: 4px;
      font-size: 0.9rem; margin-bottom: 4px;
    }
    .key-box .label { font-size: 0.75rem; color: #8b949e; }
    .key-box.active { border-color: #238636; background: #1c2d22; }

    .control-section {
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 10px; padding: 16px; margin-bottom: 20px; text-align: left;
    }
    .control-row { margin-bottom: 16px; }
    .control-row:last-child { margin-bottom: 0; }
    .control-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.88rem; margin-bottom: 8px; font-weight: bold;
    }
    .slider-container { display: flex; align-items: center; gap: 10px; }
    input[type="range"] { flex: 1; accent-color: #238636; cursor: pointer; height: 6px; }
    .vol-value { font-size: 0.8rem; width: 36px; text-align: right; color: #58a6ff; font-weight: bold; }
    .status-badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: normal; }
    .bg-on { background: #238636; color: #fff; }
    .bg-off { background: #da3633; color: #fff; }

    .mode-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 12px; border-top: 1px dashed #30363d; font-size: 0.85rem;
    }

    .play-btn {
      background: #238636; color: #ffffff; border: none;
      padding: 14px; font-size: 1rem; font-weight: bold;
      border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s;
    }
    .play-btn:hover { background: #2ea043; }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Summer </h1>
    <p class="desc">단축키로 출력모드를 변경해보세요 !</p>

    <div class="key-guide">
      <div id="boxQ" class="key-box active">
        <span class="key">Q</span>
        <div class="label">왼손 ON/OFF</div>
      </div>
      <div id="boxW" class="key-box active">
        <span class="key">W</span>
        <div class="label">좌우/중앙 전환</div>
      </div>
      <div id="boxE" class="key-box active">
        <span class="key">E</span>
        <div class="label">오른손 ON/OFF</div>
      </div>
    </div>

    <div class="control-section">
      <div class="control-row">
        <div class="control-header">
          <span>👈 왼손 (베이스) 볼륨</span>
          <span id="badgeLeft" class="status-badge bg-on">ON</span>
        </div>
        <div class="slider-container">
          <input type="range" id="volLeft" min="0" max="100" value="80" />
          <span id="txtLeft" class="vol-value">80%</span>
        </div>
      </div>

      <div class="control-row">
        <div class="control-header">
          <span>👉 오른손 (멜로디) 볼륨</span>
          <span id="badgeRight" class="status-badge bg-on">ON</span>
        </div>
        <div class="slider-container">
          <input type="range" id="volRight" min="0" max="100" value="80" />
          <span id="txtRight" class="vol-value">80%</span>
        </div>
      </div>

      <div class="mode-bar">
        <span>📻 채널 출력 모드:</span>
        <span id="txtMode" style="color:#58a6ff; font-weight:bold;">좌우 분리 (Stereo)</span>
      </div>
    </div>

    <button id="playBtn" class="play-btn">▶ 연주 시작 (Spacebar)</button>
  </div>

2) // ^(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(8) / D5(8) / E5(8) ~ E5(8) / A5(4) / F#5(8) ~// F#5(2) / F#5&A4(4) / G5&B4(4) // A5&C#5(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&B4(4) / F#5(8) / D5(8) ~ D5(4) / F#5(8) / G5(8) // A5&C#5(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&D5(4) / F#5(8) / D5(8) ~ D5(4) / D5(8) / E5(8) // F#5&B4&G#4(4) / F#5(8) / F#5(8) ~ F#5(4) / F#5(4) // F#5&B4&G4(2) / B5&E5(8),F#5(8),E5(8)<3> / D5(8) / B4(8) // D5(2) / D6(2) // C#6&C#5(3) / A5&A4(4) // F#5&F#4(2) / D4&B3(4) / F#4(4) // E4&C#4(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(4) / D6&D5(2) // C#6&C#5(3) / A6&A5(4) // B5&F#5&D5(2) / B3(8) / C#4(8) / D4(8) / E4(8) // F#4(8) / G4(8) / E4(4) / A4(8) / D5(8) / E5(8) / F#5(8) // D5(2) / D6(2) // C#6&C#5(3) / A5&A4(4) // F#5&F#4(2) / D4&B3(4) / F#4(4) // E4&C#4(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / D5(8) ~ D5(2) // B4&G4&D4(4d) / A4&D4(8) ~ A4&D4(4) / G4&D4(4) // F#4&E4&D4(1)";

    // [핵심 해결] 완벽하고 엄격한 정규식 파서
    function parseCustomScore(scoreText) {
      const measures = scoreText.split('//');
      let events = [];
      let currentMeasure = 0;

      measures.forEach(mText => {
        const notesRaw = mText.split('/');
        let currentBeatInMeasure = 0;

        notesRaw.forEach(nRaw => {
          let str = nRaw.trim();
          if (!str) return;

          let isTied = str.startsWith('~');
          if (isTied) str = str.substring(1).trim();

          let isTriplet = str.includes('<3>');
          if (isTriplet) str = str.replace('<3>', '').trim();

          const subNotes = str.split(',');

          subNotes.forEach(subStr => {
            let itemStr = subStr.trim();
            if (!itemStr) return;

            let noteNameRaw = itemStr;
            let durationVal = '4';
            let isStaccato = false;

            const match = itemStr.match(/^([^\(]+)\(([^\)]+)\)$/);
            if (match) {
              noteNameRaw = match[1].trim();
              const attrStr = match[2].trim();
              const attrs = attrStr.split(',').map(s => s.trim());
              durationVal = attrs[0];
              isStaccato = attrs.includes('Staccato');
            }

            let durUnits = 1.0;
            if (durationVal === '1') durUnits = 4.0;
            else if (durationVal === '2') durUnits = 2.0;
            else if (durationVal === '3') durUnits = 3.0;
            else if (durationVal === '4') durUnits = 1.0;
            else if (durationVal === '8') durUnits = 0.5;
            else if (durationVal === '4d') durUnits = 1.5;

            if (isTriplet) durUnits *= (2 / 3);

            const beatInt = Math.floor(currentBeatInMeasure);
            const beatRem = currentBeatInMeasure - beatInt;
            const sixteenth = Math.round(beatRem * 4);
            const timePosition = `${currentMeasure}:${beatInt}:${sixteenth}`;

            // [핵심 고침] Pure Note extraction - B2, F#3 등 순수한 음표명만 정규식 추출
            let noteArray = [];
            if (!noteNameRaw.startsWith('^') && !noteNameRaw.startsWith('X')) {
              const rawNotes = noteNameRaw.split('&');
              rawNotes.forEach(rn => {
                const cleanNote = rn.match(/[A-G][#b]?[0-8]/g);
                if (cleanNote) noteArray.push(...cleanNote);
              });
            }

            let baseDurationSec = durUnits * (60 / 112); 
            let playDuration = isStaccato ? 0.12 : baseDurationSec * 0.85;

            if (isTied && events.length > 0) {
              events[events.length - 1].duration += playDuration;
            } else if (noteArray.length > 0) {
              events.push({
                time: timePosition,
                notes: noteArray,
                duration: playDuration
              });
            }

            currentBeatInMeasure += durUnits;
          });
        });

        currentMeasure++;
      });

      return events;
    }

    const leftEvents = parseCustomScore(leftHandScoreText);
    const rightEvents = parseCustomScore(rightHandScoreText);

    const leftPart = new Tone.Part((time, event) => {
      leftSynth.triggerAttackRelease(event.notes, event.duration, time, 0.7);
    }, leftEvents);

    const rightPart = new Tone.Part((time, event) => {
      rightSynth.triggerAttackRelease(event.notes, event.duration, time, 0.85);
    }, rightEvents);

    leftPart.loop = false;
    rightPart.loop = false;
    Tone.Transport.bpm.value = 112;

    // UI 컨트롤
    let stateLeft = true;
    let stateRight = true;
    let isStereo = true;

    const volLeftSlider = document.getElementById("volLeft");
    const volRightSlider = document.getElementById("volRight");
    const txtLeft = document.getElementById("txtLeft");
    const txtRight = document.getElementById("txtRight");
    const badgeLeft = document.getElementById("badgeLeft");
    const badgeRight = document.getElementById("badgeRight");
    const txtMode = document.getElementById("txtMode");

    const boxQ = document.getElementById("boxQ");
    const boxW = document.getElementById("boxW");
    const boxE = document.getElementById("boxE");

    function percentToDb(val) {
      if (val <= 0) return -100;
      return (val / 100) * 40 - 40;
    }

    function updateAudioAndUI() {
      const valL = parseInt(volLeftSlider.value);
      txtLeft.innerText = `${valL}%`;
      if (stateLeft) {
        leftVol.volume.rampTo(percentToDb(valL), 0.1);
        badgeLeft.innerText = "ON";
        badgeLeft.className = "status-badge bg-on";
        boxQ.classList.add("active");
      } else {
        leftVol.volume.rampTo(-100, 0.1);
        badgeLeft.innerText = "OFF";
        badgeLeft.className = "status-badge bg-off";
        boxQ.classList.remove("active");
      }

      const valR = parseInt(volRightSlider.value);
      txtRight.innerText = `${valR}%`;
      if (stateRight) {
        rightVol.volume.rampTo(percentToDb(valR), 0.1);
        badgeRight.innerText = "ON";
        badgeRight.className = "status-badge bg-on";
        boxE.classList.add("active");
      } else {
        rightVol.volume.rampTo(-100, 0.1);
        badgeRight.innerText = "OFF";
        badgeRight.className = "status-badge bg-off";
        boxE.classList.remove("active");
      }

      if (isStereo) {
        leftPanner.pan.value = -1;
        rightPanner.pan.value = 1;
        txtMode.innerText = "좌우 분리 (Stereo)";
        txtMode.style.color = "#58a6ff";
        boxW.classList.add("active");
      } else {
        leftPanner.pan.value = 0;
        rightPanner.pan.value = 0;
        txtMode.innerText = "중앙 모노 (Mono)";
        txtMode.style.color = "#d29922";
        boxW.classList.remove("active");
      }
    }

    volLeftSlider.addEventListener("input", updateAudioAndUI);
    volRightSlider.addEventListener("input", updateAudioAndUI);

    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (key === "q") {
        stateLeft = !stateLeft;
        updateAudioAndUI();
      } else if (key === "e") {
        stateRight = !stateRight;
        updateAudioAndUI();
      } else if (key === "w") {
        isStereo = !isStereo;
        updateAudioAndUI();
      } else if (key === " " || key === "spacebar") {
        e.preventDefault();
        togglePlay();
      }
    });

    let isPlaying = false;
    const playBtn = document.getElementById("playBtn");

    async function togglePlay() {
      await Tone.start();

      if (!isPlaying) {
        Tone.Transport.position = 0;
        Tone.Transport.start();
        leftPart.start(0);
        rightPart.start(0);
        isPlaying = true;
        playBtn.innerText = "❚❚ 일시정지 (Spacebar)";
        playBtn.style.background = "#da3633";
      } else {
        Tone.Transport.stop();
        leftSynth.releaseAll();
        rightSynth.releaseAll();
        isPlaying = false;
        playBtn.innerText = "▶ 연주 시작 (Spacebar)";
        playBtn.style.background = "#238636";
      }
    }

    playBtn.addEventListener("click", togglePlay);

    updateAudioAndUI();
  </script>
