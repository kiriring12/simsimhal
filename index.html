<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      font-family: 'Pretendard', -apple-system, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; color: #ffffff;
    }
    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      padding: 36px 28px; border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center; max-width: 480px; width: 92%;
    }
    h1 { margin: 0 0 6px 0; font-size: 1.8rem; font-weight: 700; }
    p { color: #a0aec0; font-size: 0.9rem; margin: 0 0 24px 0; }
    
    .channel-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .mode-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0; padding: 12px 10px;
      font-size: 0.88rem; font-weight: 600; border-radius: 14px;
      cursor: pointer; transition: all 0.2s ease;
    }
    .mode-btn:hover { background: rgba(255, 255, 255, 0.18); }
    .mode-btn.active {
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      border-color: transparent; color: white;
      box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
    }

    .controls { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .btn-play {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      border: none; color: #05180d; padding: 16px 36px;
      font-size: 1.05rem; font-weight: 700; border-radius: 30px;
      cursor: pointer; transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(56, 239, 125, 0.3); width: 100%;
    }
    .btn-play:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(56, 239, 125, 0.45); }
    
    .volume-box {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, 0.05); padding: 12px 18px; border-radius: 16px;
    }
    .volume-box label { font-size: 0.85rem; font-weight: 600; color: #cbd5e0; }
    .volume-box input[type="range"] { width: 65%; accent-color: #38ef7d; cursor: pointer; }
    
    .status { margin-top: 18px; font-size: 0.85rem; color: #38ef7d; font-weight: 600; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Summer (Interactive)</h1>
    <p>채널 선택 버튼으로 원하는 소리만 들어보세요</p>

    <!-- 채널 모드 선택 버튼 4개 -->
    <div class="channel-group">
      <button id="btnStereo" class="mode-btn active">🎧 양손 입체 (L/R)</button>
      <button id="btnMono" class="mode-btn">📻 중앙 모노 (구분없음)</button>
      <button id="btnLeft" class="mode-btn">👈 왼손(베이스)만</button>
      <button id="btnRight" class="mode-btn">👉 오른손(멜로디)만</button>
    </div>
    
    <div class="controls">
      <button id="playBtn" class="btn-play">▶ 연주 시작</button>
      
      <div class="volume-box">
        <label for="volumeSlider">🔊 볼륨</label>
        <input type="range" id="volumeSlider" min="-30" max="6" value="-4" step="1">
      </div>
    </div>
    
    <div id="statusText" class="status">🎧 양손 분리 모드 (왼쪽: 베이스 / 오른쪽: 멜로디)</div>
  </div>

    const rightReverb = new Tone.Reverb({ decay: 2.2, wet: 0.25 }).connect(rightPanner);

    const leftSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.01, decay: 0.35, sustain: 0.25, release: 1.0 }

    const rightSynth = new Tone.PolySynth(Tone.Synth, {

        result.push(notes.map(n => `${n.trim()}${durStr}`).join(' / '));
      });
      return result.join(' // ');
    }

    const sec_99_101 = "D3(4) / A3(4) / D4(2) // G3&G2(4) / F#3&F#2(8) ~ F#3&F#2(4) / E3&E2(4) // D3&D2(1)";

    const leftHandScoreText = [
      sec_1_16, sec_17_24, sec_25_32, sec_33_34, sec_35_42,

    // --- 오른손 악보 데이터 ---

    // --- 커스텀 파서 ---
    function parseCustomScore(scoreText) {
      const measures = scoreText.split('//');
      let events = [];
      let currentMeasure = 0;

      measures.forEach(mText => {
        const notesRaw = mText.split('/');
        let currentBeatInMeasure = 0;

        notesRaw.forEach(nRaw => {
          let str = nRaw.trim();
          if (!str) return;

          let isTied = false;
          if (str.startsWith('~')) {
            isTied = true;
            str = str.substring(1).trim();
          }

          let isTriplet = false;
          if (str.includes('<3>')) {
            isTriplet = true;
            str = str.replace('<3>', '').trim();
          }

          const subNotes = str.split(',');

          subNotes.forEach(subStr => {
            let itemStr = subStr.trim();
            if (!itemStr) return;

            const match = itemStr.match(/^([^\(]+)\(([^\)]+)\)$/);
            if (!match) return;

            const noteNameRaw = match[1].trim();
            const attrStr = match[2].trim();
            const attrs = attrStr.split(',').map(s => s.trim());
            const durationVal = attrs[0]; 
            const isStaccato = attrs.includes('Staccato');

            let durUnits = 1.0;
            if (durationVal === '1') durUnits = 4.0;
            else if (durationVal === '2') durUnits = 2.0;
            else if (durationVal === '3') durUnits = 3.0;
            else if (durationVal === '4') durUnits = 1.0;
            else if (durationVal === '8') durUnits = 0.5;
            else if (durationVal === '4d') durUnits = 1.5;

            if (isTriplet) {
              durUnits = durUnits * (2 / 3);
            }

            const beatInt = Math.floor(currentBeatInMeasure);
            const beatRem = currentBeatInMeasure - beatInt;
            const sixteenth = Math.round(beatRem * 4);
            const timePosition = `${currentMeasure}:${beatInt}:${sixteenth}`;

            let noteArray = [];
            if (!noteNameRaw.startsWith('^') && !noteNameRaw.startsWith('X')) {
              noteArray = noteNameRaw.split('&').map(s => s.trim());
            }

            let playDuration = durUnits * (60 / 112); 
            if (isStaccato) {
              playDuration = durUnits * 0.45 * (60 / 112);
            }

            if (isTied && events.length > 0) {
              events[events.length - 1].duration += playDuration;
            } else if (noteArray.length > 0) {
              events.push({
                time: timePosition,
                notes: noteArray,
                duration: playDuration
              });
            }

            currentBeatInMeasure += durUnits;
          });
        });

        currentMeasure++;
      });

      return events;
    }

    // 파싱 및 등록
    const leftEvents = parseCustomScore(leftHandScoreText);
    const rightEvents = parseCustomScore(rightHandScoreText);

    const leftPart = new Tone.Part((time, event) => {
      leftSynth.triggerAttackRelease(event.notes, event.duration, time, 0.7);
    }, leftEvents);

    const rightPart = new Tone.Part((time, event) => {
      rightSynth.triggerAttackRelease(event.notes, event.duration, time, 0.85);
    }, rightEvents);

    leftPart.loop = false;
    rightPart.loop = false;
    Tone.Transport.bpm.value = 112;

    // --- 채널 모드 제어 버튼 로직 ---
    const btnStereo = document.getElementById("btnStereo");
    const btnMono = document.getElementById("btnMono");
    const btnLeft = document.getElementById("btnLeft");
    const btnRight = document.getElementById("btnRight");
    const modeBtns = [btnStereo, btnMono, btnLeft, btnRight];
    const statusText = document.getElementById("statusText");

    function setActiveBtn(targetBtn) {
      modeBtns.forEach(btn => btn.classList.remove("active"));
      targetBtn.classList.add("active");
    }

    // 1. 양손 입체 (L/R 분리)
    btnStereo.addEventListener("click", () => {
      setActiveBtn(btnStereo);
      leftPanner.pan.value = -0.9;
      rightPanner.pan.value = 0.9;
      leftSynth.volume.value = 0;
      rightSynth.volume.value = 0;
      statusText.innerText = "🎧 양손 입체 모드 (왼쪽: 베이스 / 오른쪽: 멜로디)";
    });

    // 2. 중앙 모노 (구분 없음)
    btnMono.addEventListener("click", () => {
      setActiveBtn(btnMono);
      leftPanner.pan.value = 0;
      rightPanner.pan.value = 0;
      leftSynth.volume.value = 0;
      rightSynth.volume.value = 0;
      statusText.innerText = "📻 중앙 모노 모드 (양손 모두 중앙에서 출력)";
    });

    // 3. 왼손(베이스)만 들리기
    btnLeft.addEventListener("click", () => {
      setActiveBtn(btnLeft);
      leftPanner.pan.value = -0.9;
      leftSynth.volume.value = 0;
      rightSynth.volume.value = -Infinity; // 오른손 음소거
      statusText.innerText = "👈 왼손(베이스) 솔로 연주 모드";
    });

    // 4. 오른손(멜로디)만 들리기
    btnRight.addEventListener("click", () => {
      setActiveBtn(btnRight);
      rightPanner.pan.value = 0.9;
      rightSynth.volume.value = 0;
      leftSynth.volume.value = -Infinity; // 왼손 음소거
      statusText.innerText = "👉 오른손(멜로디) 솔로 연주 모드";
    });

    // 재생 및 전체 볼륨
    let isPlaying = false;
    const playBtn = document.getElementById("playBtn");
    const volumeSlider = document.getElementById("volumeSlider");

    volumeSlider.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      if (val === -30) {
        Tone.Destination.mute = true;
      } else {
        Tone.Destination.mute = false;
        Tone.Destination.volume.value = val;
      }
    });

    playBtn.addEventListener("click", async () => {
      await Tone.start();

      if (!isPlaying) {
        Tone.Transport.start();
        leftPart.start(0);
        rightPart.start(0);
        isPlaying = true;
        playBtn.innerText = "❚❚ 일시정지";
      } else {
        Tone.Transport.stop();
        isPlaying = false;
        playBtn.innerText = "▶ 연주 시작";
      }
    });
  </script>
</body>
</html>
