<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer - Joe Hisaishi</title>
  <!-- Tone.js 오디오 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #2c3e50;
    }
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      padding: 40px 32px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.9rem;
      font-weight: 700;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      margin: 0 0 28px 0;
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .btn {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      border: none;
      color: white;
      padding: 14px 36px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.35);
      width: 100%;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(79, 172, 254, 0.5);
    }
    .volume-box {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.04);
      padding: 12px 18px;
      border-radius: 16px;
    }
    .volume-box label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
    }
    .volume-box input[type="range"] {
      width: 65%;
      accent-color: #4facfe;
      cursor: pointer;
    }
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 6px;
      height: 40px;
      margin-top: 24px;
    }
    .bar {
      width: 7px;
      height: 8px;
      background-color: #4facfe;
      border-radius: 4px;
      transition: height 0.12s ease;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Summer</h1>
    <p>Joe Hisaishi — 기쿠지로의 여름 OST</p>
    
    <div class="controls">
      <button id="playBtn" class="btn">▶ 연주 시작</button>
      
      <!-- 소리 조절 슬라이더 바 -->
      <div class="volume-box">
        <label for="volumeSlider">🔊 볼륨</label>
        <input type="range" id="volumeSlider" min="-30" max="6" value="0" step="1">
      </div>
    </div>
    
    <div class="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <script>
    // 1. 공간감 효과(리버브) 및 피아노 음색
    const reverb = new Tone.Reverb({ decay: 2.0, wet: 0.25 }).toDestination();
    
    const synth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: {
        attack: 0.01,
        decay: 0.4,
        sustain: 0.2,
        release: 1.0
      }
    }).connect(reverb);

    // Master 볼륨 설정 (기본값 0dB)
    Tone.Destination.volume.value = 0;

    // 2. 실제 <Summer> 메인 테마 계이름 (A 메이저 조)
    // Intro + A 파트 메인 멜로디
    const rightHand = [
      // INTRO (특유의 3음 튀김: C#5 - D5 - E5)
      { time: "0:0:0", note: "C#5", duration: "16n" },
      { time: "0:0:1", note: "D5", duration: "16n" },
      { time: "0:0:2", note: "E5", duration: "8n" },
      
      { time: "0:1:0", note: "C#5", duration: "16n" },
      { time: "0:1:1", note: "D5", duration: "16n" },
      { time: "0:1:2", note: "E5", duration: "8n" },

      { time: "0:2:0", note: "C#5", duration: "16n" },
      { time: "0:2:1", note: "D5", duration: "16n" },
      { time: "0:2:2", note: "E5", duration: "8n" },

      { time: "0:3:0", note: "C#5", duration: "16n" },
      { time: "0:3:1", note: "D5", duration: "16n" },
      { time: "0:3:2", note: "E5", duration: "8n" },

      // 메인 멜로디 테마 (A 마디부터)
      { time: "1:0:0", note: "A5", duration: "8n" },
      { time: "1:0:2", note: "F#5", duration: "8n" },
      { time: "1:1:0", note: "E5", duration: "8n" },
      { time: "1:1:2", note: "C#5", duration: "8n" },
      { time: "1:2:0", note: "D5", duration: "8n" },
      { time: "1:2:2", note: "C#5", duration: "8n" },
      { time: "1:3:0", note: "B4", duration: "4n" },

      { time: "2:0:0", note: "A4", duration: "8n" },
      { time: "2:0:2", note: "B4", duration: "8n" },
      { time: "2:1:0", note: "C#5", duration: "8n" },
      { time: "2:1:2", note: "D5", duration: "8n" },
      { time: "2:2:0", note: "E5", duration: "4n" },
      { time: "2:3:0", note: "A4", duration: "4n" },

      { time: "3:0:0", note: "A5", duration: "8n" },
      { time: "3:0:2", note: "F#5", duration: "8n" },
      { time: "3:1:0", note: "E5", duration: "8n" },
      { time: "3:1:2", note: "C#5", duration: "8n" },
      { time: "3:2:0", note: "D5", duration: "8n" },
      { time: "3:2:2", note: "C#5", duration: "8n" },
      { time: "3:3:0", note: "B4", duration: "4n" }
    ];

    // 3. 베이스 라인 반주 (A - D - E - A 진행)
    const leftHand = [
      // 1마디 Intro 베이스
      { time: "0:0:0", note: "A2", duration: "2n" },
      { time: "0:2:0", note: "A2", duration: "2n" },

      // 2마디
      { time: "1:0:0", note: "A2", duration: "4n" },
      { time: "1:1:0", note: "E3", duration: "4n" },
      { time: "1:2:0", note: "F#2", duration: "4n" },
      { time: "1:3:0", note: "C#3", duration: "4n" },

      // 3마디
      { time: "2:0:0", note: "D2", duration: "4n" },
      { time: "2:1:0", note: "A2", duration: "4n" },
      { time: "2:2:0", note: "E2", duration: "4n" },
      { time: "2:3:0", note: "B2", duration: "4n" },

      // 4마디
      { time: "3:0:0", note: "A2", duration: "4n" },
      { time: "3:1:0", note: "E3", duration: "4n" },
      { time: "3:2:0", note: "F#2", duration: "4n" },
      { time: "3:3:0", note: "C#3", duration: "4n" }
    ];

    let isPlaying = false;
    const playBtn = document.getElementById("playBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const bars = document.querySelectorAll(".bar");

    // 볼륨 조절 이벤트 (dB 단위 변환)
    volumeSlider.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      // -30일 때는 완전히 소리 끔(Mute)
      if (val === -30) {
        Tone.Destination.mute = true;
      } else {
        Tone.Destination.mute = false;
        Tone.Destination.volume.value = val;
      }
    });

    // 비주얼라이저
    function animateVisualizer() {
      if (!isPlaying) {
        bars.forEach(bar => bar.style.height = "8px");
        return;
      }
      bars.forEach(bar => {
        const randomHeight = Math.floor(Math.random() * 32) + 8;
        bar.style.height = randomHeight + "px";
      });
      setTimeout(animateVisualizer, 100);
    }

    // 양손 악보 통합
    const score = [
      ...rightHand.map(e => ({ ...e, velocity: 0.85 })),
      ...leftHand.map(e => ({ ...e, velocity: 0.55 }))
    ];

    const part = new Tone.Part((time, event) => {
      synth.triggerAttackRelease(event.note, event.duration, time, event.velocity);
    }, score);

    part.loop = true;
    part.loopEnd = "4:0:0";
    Tone.Transport.bpm.value = 110;

    // 재생 / 일시정지 컨트롤
    playBtn.addEventListener("click", async () => {
      await Tone.start();

      if (!isPlaying) {
        Tone.Transport.start();
        part.start(0);
        isPlaying = true;
        playBtn.innerText = "❚❚ 일시정지";
        animateVisualizer();
      } else {
        Tone.Transport.stop();
        isPlaying = false;
        playBtn.innerText = "▶ 연주 시작";
      }
    });
  </script>
</body>
</html>
