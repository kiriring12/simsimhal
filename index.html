<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117; color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .panel {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 16px; padding: 32px 24px;
      max-width: 480px; width: 100%; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    h1 { color: #58a6ff; font-size: 1.6rem; margin-bottom: 8px; }
    p { font-size: 0.9rem; color: #8b949e; margin-bottom: 24px; }

    .key-guide {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin-bottom: 24px;
    }
    .key-box {
      background: #21262d; border: 1px solid #30363d;
      border-radius: 10px; padding: 12px 8px;
    }
    .key-box .key {
      display: inline-block; background: #30363d; color: #f0f6fc;
      font-weight: bold; padding: 4px 10px; border-radius: 6px;
      font-size: 1rem; border-bottom: 3px solid #161b22; margin-bottom: 6px;
    }
    .key-box .label { font-size: 0.78rem; color: #8b949e; }
    .key-box.active { border-color: #238636; background: #1c2d22; }

    .status-display {
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 10px; padding: 16px; margin-bottom: 20px; text-align: left;
    }
    .status-row {
      display: flex; justify-content: space-between;
      font-size: 0.9rem; margin-bottom: 6px;
    }
    .status-row:last-child { margin-bottom: 0; }
    .val-on { color: #3fb950; font-weight: bold; }
    .val-off { color: #f85149; font-weight: bold; }

    .play-btn {
      background: #238636; color: #ffffff; border: none;
      padding: 14px; font-size: 1rem; font-weight: bold;
      border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s;
    }
    .play-btn:hover { background: #2ea043; }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Summer (피아노 연주기)</h1>
    <p>키보드로 소리를 자유롭게 켜고 꺼보세요</p>

    <!-- 키보드 조작 안내 -->
    <div class="key-guide">
      <div id="boxQ" class="key-box active">
        <span class="key">Q</span>
        <div class="label">왼손 (베이스)</div>
      </div>
      <div id="boxW" class="key-box active">
        <span class="key">W</span>
        <div class="label">좌우 분리</div>
      </div>
      <div id="boxE" class="key-box active">
        <span class="key">E</span>
        <div class="label">오른손 (멜로디)</div>
      </div>
    </div>

    <!-- 실시간 상태 표시 -->
    <div class="status-display">
      <div class="status-row">
        <span>👈 왼손 (L-Channel):</span>
        <span id="stLeft" class="val-on">ON</span>
      </div>
      <div class="status-row">
        <span>👉 오른손 (R-Channel):</span>
        <span id="stRight" class="val-on">ON</span>
      </div>
      <div class="status-row">
        <span>📻 채널 위치:</span>
        <span id="stMode" class="val-on" style="color:#58a6ff;">좌우 분리 (Stereo)</span>
      </div>
    </div>

    <button id="playBtn" class="play-btn">▶ 연주 시작 (Spacebar)</button>
  </div>

  <script>
    // 1. 오디오 노드 구축 (Channel 노드 사용으로 안정성 강화)
    const leftChannel = new Tone.Channel({ pan: -1, volume: 0 }).toDestination();
    const rightChannel = new Tone.Channel({ pan: 1, volume: 0 }).toDestination();

    const leftSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.01, decay: 0.35, sustain: 0.25, release: 1.0 }
    }).connect(leftChannel);

    const rightSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.01, decay: 0.3, sustain: 0.2, release: 1.0 }
    }).connect(rightChannel);

    Tone.Destination.volume.value = -2;

    // --- 왼손 악보 데이터 ---
    function buildPattern(measures, defaultDuration = "4", isStaccato = true) {
      let result = [];
      measures.forEach(m => {
        const notes = m.split('/');
        const durStr = isStaccato ? `(${defaultDuration},Staccato)` : `(${defaultDuration})`;
        result.push(notes.map(n => `${n.trim()}${durStr}`).join(' / '));
      });
      return result.join(' // ');
    }

    const patternA_Measures = ["B2 / F#3 / B3 / F#3", "G2 / D3 / G3 / D3", "A2 / E3 / A3 / E3", "D2 / A2 / D3 / A2"];
    const patternB_Measures = ["A2 / E3 / A3 / E3", "G2 / D3 / G3 / D3", "F#2 / C#3 / A3 / C#3", "B2 / F#3 / B3 / F#3", "E2 / B2 / E3 / B2", "G2 / D3 / G3 / D3", "A2 / E3 / A3 / E3", "A2 / E3 / A3 / E3"];

    let m_1_16 = [];
    for(let i=0; i<4; i++) m_1_16.push(buildPattern(patternA_Measures));
    const sec_1_16 = m_1_16.join(' // ');

    const sec_17_24 = buildPattern(patternB_Measures);

    let m_25_32 = [];
    for(let i=0; i<2; i++) m_25_32.push(buildPattern(patternA_Measures));
    const sec_25_32 = m_25_32.join(' // ');

    const sec_33_34 = "E2(4) / B2(4) / E3(4) / B2(4) // A2(1)";
    const sec_35_42 = "D3(4) / A3(4) / E4(4) / A3(4) // B2(4) / E#3(4) / B3(4) / E#3(4) // F2(4) / D3(4) / F3(4) / D3(4) // A2(4) / E3(4) / A3(4) / E3(4) // D3(4) / A3(4) / E4(4) / A3(4) // B2(4) / E#3(4) / B3(4) / E#3(4) // F2(4) / D3(4) / F3(4) / D3(4) // A2(4) / E3(4) / A3(4) / E3(4)";
    const sec_43_71 = "A3&F#3&D3(2) / A3&F#3&D3(2) // A3&G3&E3(2) / A3&G3&E3(2) // A3&F#3(2) / A3&F#3(2) // A3&G3(4) / A3&F#3(8) ~ A3&F#3(4) / A3&E3(4) // A3&F#3&D3(4,Staccato) / A3&F#3&D3(4,Staccato) / A3&F#3&D3(4,Staccato) / A3&F#3&D3(4,Staccato) // A3&G3&E3(4,Staccato) / A3&G3&E3(4,Staccato) / A3&G3&E3(4,Staccato) / A3&G3&E3(4,Staccato) // A3&F#3(4) / A3&F#3(4) / A3&F#3(4) / A3&F#3(4) // A3&G3(4) / A3&F#3(8) ~ A3&F#3(4) / A3&E3(4) // D4&B3&G3(2) / D4&B3&G3(2) // D4&C4&A4(2) / D4&C4&A3(2) // D4&B3(2) // D4&B3(2) // D4&C4(4) / D4&B3(8) ~ D4&B3(4) / D4&A3(4) // D4&B3&G3(4,Staccato) / D4&B3&G3(4,Staccato) / D4&B3&G3(4,Staccato) / D4&B3&G3(4,Staccato) // D4&C4&A3(4,Staccato) / D4&C4&A3(4,Staccato) / D4&C4&A3(4,Staccato) / D4&C4&A3(4,Staccato) // D4&B3(4,Staccato) / D4&B3(4,Staccato) / D4&B3(4,Staccato) / D4&B3(4,Staccato) // D4&C4(4) / D4&B3(8) ~ D4&B3(4) / D4&A3(4) // D2(4) / A2(4) / D3(4) / E3(4) // E2(4) / B2(4) / E3(4) / G3(4) // F#2(4) / D3(4) / F#3(4) / A3(4) // G3&G2(4) / F#3&F#2(8) ~ F#3&F#2(4) / E3&E2(4) // D2(4) / A2(4) / D3(4) / E3(4) // E2(4) / B2(4) / E3(4) / G3(4) // F#2(4) / D3(4) / F#3(4) / A3(4) // G3&G2(4) / F#3&F#2(8) ~ F#3&F#2(4) / E3&E2(4) // A2&A1(2) / C4&A3&E3(2) // G2&G1(2) / D4&B3&G3(2) // F#2&F#1(2) / E4&C4&F#3(2) // B2&B1(2) / D4&B3&F#3(2) // E2&E1(2) / D4&B3&G#3(2) // G2&G1(2) / D4&B3&G3(2) // A2&A1(2) / E4&A3&G3(2) // A2&A1(2) / C#4&A3&G3(2)";

    const sec_85_86 = sec_33_34;
    const sec_87_98 = sec_35_42 + " // " + "D3(4) / A3(4) / E4(4) / A3(4) // B2(4) / E#3(4) / B3(4) / E#3(4) // F2(4) / D3(4) / F3(4) / D3(4) // A2(4) / E3(4) / A3(4) / E3(4)";
    const sec_99_101 = "D3(4) / A3(4) / D4(2) // G3&G2(4) / F#3&F#2(8) ~ F#3&F#2(4) / E3&E2(4) // D3&D2(1)";

    const leftHandScoreText = [
      sec_1_16, sec_17_24, sec_25_32, sec_33_34, sec_35_42,
      sec_43_71, sec_72_79, sec_80_84, sec_85_86, sec_87_98, sec_99_101

    // --- 오른손 악보 데이터 ---
    const rightHandScoreText = "X(1) // X(1) // X(1) // X(1) // X(1) // X(1) // X(1) // X(2) /  A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / D5(8) ~ D5(2) // ^(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / E5(8) ~ E5(8) / F#5(4) / F#5(8) ~// F#5(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / D5(8) ~ D5(2) // ^(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / E5(8) ~ E5(8) / A5(4) / F#5(8) ~// F#5(2) / F#5&A4(8) / E5&B4(8) // A5&C#5(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&B4(4) / F#5(8) / D5(8) ~ D5(4) / F#5(8) / E5(8) // A5&C#5(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&D5(4) / F#5(8) / D5(8) ~ D5(4) / D5(8) / E5(8) //  F#5&B4&G#4(4) / F#5(8) / F#5(8) ~ F#5(4) / F#5(4) // F#5&B4&G#4(4) / B5(4) / B5&E5(8),F#5(8),E5(8)<3> / D5(4) // E5(2) / E5&B4&G4(4) / B4(8) / B4(8) // E5&G4(4) / C#5(4) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / D5(8) ~ D5(2) // ^(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / E5(8) ~ E5(8) / F#5(4) / F#5(8) ~// F#5(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / D5(8) ~ D5(2) // ^(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(8) / D5(8) / E5(8) ~ E5(8) / A5(4) / F#5(8) ~// F#5(2) / F#5&A4(4) / G5&B4(4) // A5&C#5(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&B4(4) / F#5(8) / D5(8) ~ D5(4) / F#5(8) / G5(8) //   A5&C#5(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(8) / A5&C#5(4) // A5&D5(4) / F#5(8) / D5(8) ~ D5(4) / D5(8) / E5(8) // F#5&B4&G#4(4) / F#5(8) / F#5(8) ~ F#5(4) / F#5(4) // F#5&B4&G4(2) / B5&E5(8), F#5(8), E5(8)<3> / D5(8) / B4(8) // D5(2) / D5(4) / A4(4) // F#4(1) // F#4&D4(2) / D4&B3(4) / F#4(4) // E4&C4(1) // A4&F#4&E4&D4(2) / A4&F#4&D4(4) / E4(8) / D4(8) //  A4&F#4&E4&D4(2) / A4&F#4&D4(4) / E4(8) / D4(8) //  A4&F#4&E4&D4(2) / A4&F#4&D4(4) / E4(8) / D4(8) // D4&C#4(1) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) //  A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // D6(8) / D5(8) / G5(8) / A5(8) / D6(8) / A5(8) / G5(8) / D5(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5(8) / A4(8) / D5(8) / E5(8) / A5(8) / E5(8) / D5(8) / A4(8) // A5&C#5&A4(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&B4(4) / F#5(8) / D5(8) ~ D5(4) / F#5(8) / G5(8) //   A5&C#5&A4(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&D5(4) / F#5(8) / D5(8) ~ D5(4) / D5(8) / E5(8) // F#5&B4&G#4(4) / F#5(8) / F#5(8) ~ F#5(4) / F#5(8) // F#5&B4&G4(4) / B5(4) / B5&E5(8),F#5(8),E5(8)<3> / D5(4) // E5(2) / E5&B4&G4(4) / B4(8) / B4(8) // E5&G4(4) / C#5(4) / G4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / D5(8) ~ D5(2) // ^(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / E5(8) ~ E5(8) / F#5(4) / F#5(8) ~// F#5(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / D5(8) ~ D5(2) // ^(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(8) / D5(8) / E5(8) ~ E5(8) / A5(4) / F#5(8) ~// F#5(2) / F#5&A4(4) / G5&B4(4) // A5&C#5(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&B4(4) / F#5(8) / D5(8) ~ D5(4) / F#5(8) / G5(8) //   A5&C#5(4) / A5&C#5(8) / A5&C#5(8) ~ A5&C#5(4) / A5&C#5(4) // A5&D5(4) / F#5(8) / D5(8) ~ D5(4) / D5(8) / E5(8) // F#5&B4&G#4(4) / F#5(8) / F#5(8) ~ F#5(4) / F#5(4) // F#5&B4&G4(2) / B5&E5(8),F#5(8),E5(8)<3> / D5(8) / B4(8) // D5(2) / D6(2) // C#6&C#5(3) / A5&A4(4) // F#5&F#4(2) / D4&B3(4) / F#4(4) // E4&C#4(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(4) / D6&D5(2) // C#6&C#5(3) / A6&A5(4) // B5&F#5&D5(2) / B3(8) / C#4(8) / D4(8) / E4(8) // F#4(8) / G4(8) / E4(4) / A4(8) / D5(8) / E5(8) / F#5(8) // D5(2) / D6(2) // C#6&C#5(3) / A5&A4(4) // F#5&F#4(2) / D4&B3(4) / F#4(4) // E4&C#4(2) / A4(8) / D5(8) / E5(8) / F#5(8) // E5(4) / D5(8) / D5(8) ~ D5(2) // B4&G4&D4(4d) / A4&D4(8) ~ A4&D4(4) / G4&D4(4) // F#4&E4&D4(1)";

    // --- 커스텀 파서 ---
    function parseCustomScore(scoreText) {
      const measures = scoreText.split('//');
      let events = [];
      let currentMeasure = 0;

      measures.forEach(mText => {
        const notesRaw = mText.split('/');
        let currentBeatInMeasure = 0;

        notesRaw.forEach(nRaw => {
          let str = nRaw.trim();
          if (!str) return;

          let isTied = false;
          if (str.startsWith('~')) {
            isTied = true;
            str = str.substring(1).trim();
          }

          let isTriplet = false;
          if (str.includes('<3>')) {
            isTriplet = true;
            str = str.replace('<3>', '').trim();
          }

          const subNotes = str.split(',');

          subNotes.forEach(subStr => {
            let itemStr = subStr.trim();
            if (!itemStr) return;

            const match = itemStr.match(/^([^\(]+)\(([^\)]+)\)$/);
            if (!match) return;

            const noteNameRaw = match[1].trim();
            const attrStr = match[2].trim();
            const attrs = attrStr.split(',').map(s => s.trim());
            const durationVal = attrs[0]; 
            const isStaccato = attrs.includes('Staccato');

            let durUnits = 1.0;
            if (durationVal === '1') durUnits = 4.0;
            else if (durationVal === '2') durUnits = 2.0;
            else if (durationVal === '3') durUnits = 3.0;
            else if (durationVal === '4') durUnits = 1.0;
            else if (durationVal === '8') durUnits = 0.5;
            else if (durationVal === '4d') durUnits = 1.5;

            if (isTriplet) {
              durUnits = durUnits * (2 / 3);
            }

            const beatInt = Math.floor(currentBeatInMeasure);
            const beatRem = currentBeatInMeasure - beatInt;
            const sixteenth = Math.round(beatRem * 4);
            const timePosition = `${currentMeasure}:${beatInt}:${sixteenth}`;

            let noteArray = [];
            if (!noteNameRaw.startsWith('^') && !noteNameRaw.startsWith('X')) {
              noteArray = noteNameRaw.split('&').map(s => s.trim());
            }

            let playDuration = durUnits * (60 / 112); 
            if (isStaccato) {
              playDuration = durUnits * 0.45 * (60 / 112);
            }

            if (isTied && events.length > 0) {
              events[events.length - 1].duration += playDuration;
            } else if (noteArray.length > 0) {
              events.push({
                time: timePosition,
                notes: noteArray,
                duration: playDuration
              });
            }

            currentBeatInMeasure += durUnits;
          });
        });

        currentMeasure++;
      });

      return events;
    }

    // 파싱 및 파트 스케줄링
    const leftEvents = parseCustomScore(leftHandScoreText);
    const rightEvents = parseCustomScore(rightHandScoreText);

    const leftPart = new Tone.Part((time, event) => {
      leftSynth.triggerAttackRelease(event.notes, event.duration, time, 0.85);
    }, leftEvents);

    const rightPart = new Tone.Part((time, event) => {
      rightSynth.triggerAttackRelease(event.notes, event.duration, time, 0.85);
    }, rightEvents);

    leftPart.loop = false;
    rightPart.loop = false;
    Tone.Transport.bpm.value = 112;

    // --- 상태 관리 ---
    let stateLeft = true;
    let stateRight = true;
    let isStereo = true;

    const boxQ = document.getElementById("boxQ");
    const boxW = document.getElementById("boxW");
    const boxE = document.getElementById("boxE");
    const stLeft = document.getElementById("stLeft");
    const stRight = document.getElementById("stRight");
    const stMode = document.getElementById("stMode");

    function updateAudioAndUI() {
      // 왼손 제어
      leftChannel.mute = !stateLeft;
      if (stateLeft) {
        stLeft.innerText = "ON";
        stLeft.className = "val-on";
        boxQ.classList.add("active");
      } else {
        stLeft.innerText = "OFF";
        stLeft.className = "val-off";
        boxQ.classList.remove("active");
      }

      // 오른손 제어
      rightChannel.mute = !stateRight;
      if (stateRight) {
        stRight.innerText = "ON";
        stRight.className = "val-on";
        boxE.classList.add("active");
      } else {
        stRight.innerText = "OFF";
        stRight.className = "val-off";
        boxE.classList.remove("active");
      }

      // Stereo / Mono 제어
      if (isStereo) {
        leftChannel.pan.value = -1;
        rightChannel.pan.value = 1;
        stMode.innerText = "좌우 분리 (Stereo)";
        stMode.style.color = "#58a6ff";
        boxW.classList.add("active");
      } else {
        leftChannel.pan.value = 0;
        rightChannel.pan.value = 0;
        stMode.innerText = "중앙 모노 (Mono)";
        stMode.style.color = "#d29922";
        boxW.classList.remove("active");
      }
    }

    // --- 키보드 이벤트 리스너 ---
    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();

      if (key === "q") {
        stateLeft = !stateLeft;
        updateAudioAndUI();
      } else if (key === "e") {
        stateRight = !stateRight;
        updateAudioAndUI();
      } else if (key === "w") {
        isStereo = !isStereo;
        updateAudioAndUI();
      } else if (key === " " || key === "spacebar") {
        e.preventDefault();
        togglePlay();
      }
    });

    // --- 재생 제어 ---
    let isPlaying = false;
    const playBtn = document.getElementById("playBtn");

    async function togglePlay() {
      await Tone.start();

      if (!isPlaying) {
        Tone.Transport.start();
        leftPart.start(0);
        rightPart.start(0);
        isPlaying = true;
        playBtn.innerText = "❚❚ 일시정지 (Spacebar)";
        playBtn.style.background = "#da3633";
      } else {
        Tone.Transport.stop();
        isPlaying = false;
        playBtn.innerText = "▶ 연주 시작 (Spacebar)";
        playBtn.style.background = "#238636";
      }
    }

    playBtn.addEventListener("click", togglePlay);
  </script>
</body>
</html>
