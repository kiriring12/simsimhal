<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer (Easy Score) - Joe Hisaishi</title>
  <!-- Tone.js 오디오 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #2c3e50;
    }
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      padding: 40px 32px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.9rem;
      font-weight: 700;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      margin: 0 0 28px 0;
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .btn {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      border: none;
      color: white;
      padding: 14px 36px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.35);
      width: 100%;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(79, 172, 254, 0.5);
    }
    .volume-box {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.04);
      padding: 12px 18px;
      border-radius: 16px;
    }
    .volume-box label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
    }
    .volume-box input[type="range"] {
      width: 65%;
      accent-color: #4facfe;
      cursor: pointer;
    }
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 6px;
      height: 40px;
      margin-top: 24px;
    }
    .bar {
      width: 7px;
      height: 8px;
      background-color: #4facfe;
      border-radius: 4px;
      transition: height 0.12s ease;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Summer</h1>
    <p>Joe Hisaishi — Easy Score ver.</p>
    
    <div class="controls">
      <button id="playBtn" class="btn">▶ 연주 시작</button>
      
      <div class="volume-box">
        <label for="volumeSlider">🔊 볼륨</label>
        <input type="range" id="volumeSlider" min="-30" max="6" value="-5" step="1">
      </div>
    </div>
    
    <div class="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <script>
    // 1. 이펙터 및 신시사이저 설정 (악보 느낌에 맞춰 부드럽게)
    const reverb = new Tone.Reverb({ decay: 2.2, wet: 0.3 }).toDestination();
    
    const synth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.005, decay: 0.3, sustain: 0.3, release: 1.2 }
    }).connect(reverb);

    // 초기 볼륨 설정 (-5dB)
    Tone.Destination.volume.value = -5;

    // 2. 악보 데이터 (A Major) - 처음 16마디
    
    // 오른손 멜로디 (Right Hand)
    const rightHand = [
      // 1-8마디: 오른손 쉼표
      
      // 9마디
      { time: "8:0:0", note: "E5", duration: "8n" },
      { time: "8:0:2", note: "F#5", duration: "16n." },
      { time: "8:1:1", note: "E5", duration: "16n" },
      { time: "8:2:0", note: "C#5", duration: "8n." },
      { time: "8:3:1", note: "A4", duration: "16n" },
      
      // 10마디
      { time: "9:0:0", note: "B4", duration: "2n." },
      { time: "9:3:0", note: "A4", duration: "8n" },
      { time: "9:3:2", note: "B4", duration: "8n" },
      
      // 11마디
      { time: "10:0:0", note: "C#5", duration: "8n" },
      { time: "10:0:2", note: "D5", duration: "16n." },
      { time: "10:1:1", note: "C#5", duration: "16n" },
      { time: "10:2:0", note: "A4", duration: "8n." },
      { time: "10:3:1", note: "F#4", duration: "16n" },
      
      // 12마디
      { time: "11:0:0", note: "E4", duration: "2n." },
      { time: "11:3:0", note: "A4", duration: "8n" },
      { time: "11:3:2", note: "B4", duration: "8n" },
      
      // 13마디 (9마디 반복)
      { time: "12:0:0", note: "E5", duration: "8n" },
      { time: "12:0:2", note: "F#5", duration: "16n." },
      { time: "12:1:1", note: "E5", duration: "16n" },
      { time: "12:2:0", note: "C#5", duration: "8n." },
      { time: "12:3:1", note: "A4", duration: "16n" },
      
      // 14마디 (10마디 반복)
      { time: "13:0:0", note: "B4", duration: "2n." },
      { time: "13:3:0", note: "A4", duration: "8n" },
      { time: "13:3:2", note: "B4", duration: "8n" },
      
      // 15마디 (11마디 변형)
      { time: "14:0:0", note: "C#5", duration: "8n" },
      { time: "14:0:2", note: "D5", duration: "16n." },
      { time: "14:1:1", note: "C#5", duration: "16n" },
      { time: "14:2:0", note: "A4", duration: "8n." },
      { time: "14:3:1", note: "C#5", duration: "16n" },
      
      // 16마디
      { time: "15:0:0", note: "A4", duration: "2n." },
      // 쉼표
    ];

    // 왼손 반주 (Left Hand)
    // 악보 특유의 A-D-E-A 아르페지오 패턴
    const leftHand = [
      // 1마디
      { time: "0:0:0", note: "A2", duration: "8n" },
      { time: "0:0:2", note: "E3", duration: "8n" },
      { time: "0:1:0", note: "A3", duration: "8n" },
      { time: "0:2:0", note: "C#4", duration: "8n" },
      { time: "0:2:2", note: "A3", duration: "8n" },
      { time: "0:3:0", note: "E3", duration: "8n" },
      
      // 2마디
      { time: "1:0:0", note: "D2", duration: "8n" },
      { time: "1:0:2", note: "A2", duration: "8n" },
      { time: "1:1:0", note: "D3", duration: "8n" },
      { time: "1:2:0", note: "F#3", duration: "8n" },
      { time: "1:2:2", note: "D3", duration: "8n" },
      { time: "1:3:0", note: "A2", duration: "8n" },
      
      // 3마디
      { time: "2:0:0", note: "E2", duration: "8n" },
      { time: "2:0:2", note: "B2", duration: "8n" },
      { time: "2:1:0", note: "E3", duration: "8n" },
      { time: "2:2:0", note: "G#3", duration: "8n" },
      { time: "2:2:2", note: "E3", duration: "8n" },
      { time: "2:3:0", note: "B2", duration: "8n" },
      
      // 4마디
      { time: "3:0:0", note: "A2", duration: "8n" },
      { time: "3:0:2", note: "E3", duration: "8n" },
      { time: "3:1:0", note: "A3", duration: "8n" },
      { time: "3:2:0", note: "C#4", duration: "8n" },
      { time: "3:2:2", note: "A3", duration: "8n" },
      { time: "3:3:0", note: "E3", duration: "8n" },

      // 5-8마디 (1-4 반복)
      { time: "4:0:0", note: "A2", duration: "8n" }, { time: "4:0:2", note: "E3", duration: "8n" }, { time: "4:1:0", note: "A3", duration: "8n" }, { time: "4:2:0", note: "C#4", duration: "8n" }, { time: "4:2:2", note: "A3", duration: "8n" }, { time: "4:3:0", note: "E3", duration: "8n" },
      { time: "5:0:0", note: "D2", duration: "8n" }, { time: "5:0:2", note: "A2", duration: "8n" }, { time: "5:1:0", note: "D3", duration: "8n" }, { time: "5:2:0", note: "F#3", duration: "8n" }, { time: "5:2:2", note: "D3", duration: "8n" }, { time: "5:3:0", note: "A2", duration: "8n" },
      { time: "6:0:0", note: "E2", duration: "8n" }, { time: "6:0:2", note: "B2", duration: "8n" }, { time: "6:1:0", note: "E3", duration: "8n" }, { time: "6:2:0", note: "G#3", duration: "8n" }, { time: "6:2:2", note: "E3", duration: "8n" }, { time: "6:3:0", note: "B2", duration: "8n" },
      { time: "7:0:0", note: "A2", duration: "8n" }, { time: "7:0:2", note: "E3", duration: "8n" }, { time: "7:1:0", note: "A3", duration: "8n" }, { time: "7:2:0", note: "C#4", duration: "8n" }, { time: "7:2:2", note: "A3", duration: "8n" }, { time: "7:3:0", note: "E3", duration: "8n" },

      // 9-12마디 (1-4 반복)
      { time: "8:0:0", note: "A2", duration: "8n" }, { time: "8:0:2", note: "E3", duration: "8n" }, { time: "8:1:0", note: "A3", duration: "8n" }, { time: "8:2:0", note: "C#4", duration: "8n" }, { time: "8:2:2", note: "A3", duration: "8n" }, { time: "8:3:0", note: "E3", duration: "8n" },
      { time: "9:0:0", note: "D2", duration: "8n" }, { time: "9:0:2", note: "A2", duration: "8n" }, { time: "9:1:0", note: "D3", duration: "8n" }, { time: "9:2:0", note: "F#3", duration: "8n" }, { time: "9:2:2", note: "D3", duration: "8n" }, { time: "9:3:0", note: "A2", duration: "8n" },
      { time: "10:0:0", note: "E2", duration: "8n" }, { time: "10:0:2", note: "B2", duration: "8n" }, { time: "10:1:0", note: "E3", duration: "8n" }, { time: "10:2:0", note: "G#3", duration: "8n" }, { time: "10:2:2", note: "E3", duration: "8n" }, { time: "10:3:0", note: "B2", duration: "8n" },
      { time: "11:0:0", note: "A2", duration: "8n" }, { time: "11:0:2", note: "E3", duration: "8n" }, { time: "11:1:0", note: "A3", duration: "8n" }, { time: "11:2:0", note: "C#4", duration: "8n" }, { time: "11:2:2", note: "A3", duration: "8n" }, { time: "11:3:0", note: "E3", duration: "8n" },

      // 13-16마디 (1-4 반복)
      { time: "12:0:0", note: "A2", duration: "8n" }, { time: "12:0:2", note: "E3", duration: "8n" }, { time: "12:1:0", note: "A3", duration: "8n" }, { time: "12:2:0", note: "C#4", duration: "8n" }, { time: "12:2:2", note: "A3", duration: "8n" }, { time: "12:3:0", note: "E3", duration: "8n" },
      { time: "13:0:0", note: "D2", duration: "8n" }, { time: "13:0:2", note: "A2", duration: "8n" }, { time: "13:1:0", note: "D3", duration: "8n" }, { time: "13:2:0", note: "F#3", duration: "8n" }, { time: "13:2:2", note: "D3", duration: "8n" }, { time: "13:3:0", note: "A2", duration: "8n" },
      { time: "14:0:0", note: "E2", duration: "8n" }, { time: "14:0:2", note: "B2", duration: "8n" }, { time: "14:1:0", note: "E3", duration: "8n" }, { time: "14:2:0", note: "G#3", duration: "8n" }, { time: "14:2:2", note: "E3", duration: "8n" }, { time: "14:3:0", note: "B2", duration: "8n" },
      { time: "15:0:0", note: "A2", duration: "8n" }, { time: "15:0:2", note: "E3", duration: "8n" }, { time: "15:1:0", note: "A3", duration: "8n" }, { time: "15:2:0", note: "C#4", duration: "8n" }, { time: "15:2:2", note: "A3", duration: "8n" }, { time: "15:3:0", note: "E3", duration: "8n" },
    ];

    let isPlaying = false;
    const playBtn = document.getElementById("playBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const bars = document.querySelectorAll(".bar");

    // 볼륨 조절
    volumeSlider.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      if (val === -30) {
        Tone.Destination.mute = true;
      } else {
        Tone.Destination.mute = false;
        Tone.Destination.volume.value = val;
      }
    });

    // 비주얼라이저
    function animateVisualizer() {
      if (!isPlaying) {
        bars.forEach(bar => bar.style.height = "8px");
        return;
      }
      bars.forEach(bar => {
        const randomHeight = Math.floor(Math.random() * 32) + 8;
        bar.style.height = randomHeight + "px";
      });
      setTimeout(animateVisualizer, 100);
    }

    // 악보 통합 및 강약 조절
    const score = [
      ...rightHand.map(e => ({ ...e, velocity: 0.9 })),
      ...leftHand.map(e => ({ ...e, velocity: 0.6 }))
    ];

    const part = new Tone.Part((time, event) => {
      synth.triggerAttackRelease(event.note, event.duration, time, event.velocity);
    }, score);

    // 반복 재생 및 템포 설정
    part.loop = true;
    part.loopEnd = "16:0:0"; // 쉼표 마디 포함 16마디
    Tone.Transport.bpm.value = 110;

    // 재생 컨트롤
    playBtn.addEventListener("click", async () => {
      await Tone.start();

      if (!isPlaying) {
        Tone.Transport.start();
        part.start(0);
        isPlaying = true;
        playBtn.innerText = "❚❚ 일시정지";
        animateVisualizer();
      } else {
        Tone.Transport.stop();
        isPlaying = false;
        playBtn.innerText = "▶ 연주 시작";
      }
    });
  </script>
</body>
</html>
