<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer - Joe Hisaishi (Piano Arrangement)</title>
  <!-- Tone.js 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #2c3e50;
    }
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      padding: 40px 32px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    p {
      color: #555;
      font-size: 0.95rem;
      margin: 0 0 28px 0;
    }
    .btn {
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      border: none;
      color: white;
      padding: 15px 36px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(0, 114, 255, 0.35);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 114, 255, 0.5);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 6px;
      height: 45px;
      margin-top: 32px;
    }
    .bar {
      width: 7px;
      height: 8px;
      background-color: #0072ff;
      border-radius: 4px;
      transition: height 0.12s ease;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Summer</h1>
    <p>Joe Hisaishi — 양손 피아노 편곡</p>
    <button id="playBtn" class="btn">▶ 연주 시작</button>
    
    <div class="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <script>
    // 1. 공간감을 부여하는 리버브(잔향) 이펙터 설정
    const reverb = new Tone.Reverb({
      decay: 2.5,
      preDelay: 0.01,
      wet: 0.3
    }).toDestination();

    // 2. 피아노 음색 신시사이저 설정
    const synth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: {
        attack: 0.01,
        decay: 0.5,
        sustain: 0.2,
        release: 1.5
      }
    }).connect(reverb);

    // 3. 오른손 멜로디 파트
    const rightHand = [
      // 1마디
      { time: "0:0:0", note: "A4", duration: "8n" },
      { time: "0:0:2", note: "B4", duration: "8n" },
      { time: "0:1:0", note: "C#5", duration: "8n" },
      { time: "0:1:2", note: "E5", duration: "8n" },
      { time: "0:2:0", note: "C#5", duration: "8n" },
      { time: "0:2:2", note: "B4", duration: "8n" },
      { time: "0:3:0", note: "A4", duration: "8n" },
      { time: "0:3:2", note: "F#4", duration: "8n" },
      
      // 2마디
      { time: "1:0:0", note: "A4", duration: "8n" },
      { time: "1:0:2", note: "B4", duration: "8n" },
      { time: "1:1:0", note: "C#5", duration: "8n" },
      { time: "1:1:2", note: "E5", duration: "8n" },
      { time: "1:2:0", note: "C#5", duration: "4n" },
      { time: "1:3:0", note: "B4", duration: "4n" },

      // 3마디
      { time: "2:0:0", note: "A4", duration: "8n" },
      { time: "2:0:2", note: "B4", duration: "8n" },
      { time: "2:1:0", note: "C#5", duration: "8n" },
      { time: "2:1:2", note: "E5", duration: "8n" },
      { time: "2:2:0", note: "C#5", duration: "8n" },
      { time: "2:2:2", note: "B4", duration: "8n" },
      { time: "2:3:0", note: "A4", duration: "8n" },
      { time: "2:3:2", note: "F#4", duration: "8n" },

      // 4마디
      { time: "3:0:0", note: "A4", duration: "4n" },
      { time: "3:1:0", note: "F#4", duration: "4n" },
      { time: "3:2:0", note: "E4", duration: "2n" }
    ];

    // 4. 왼손 반주 파트 (A - D - F#m - E 화음 진행 및 베이스 아르페지오)
    const leftHand = [
      // 1마디: A Major 코드 반주
      { time: "0:0:0", note: "A2", duration: "4n" },
      { time: "0:1:0", note: "E3", duration: "8n" },
      { time: "0:1:2", note: "A3", duration: "8n" },
      { time: "0:2:0", note: "C#4", duration: "8n" },
      { time: "0:2:2", note: "E3", duration: "8n" },
      { time: "0:3:0", note: "A3", duration: "8n" },
      { time: "0:3:2", note: "C#4", duration: "8n" },

      // 2마디: D Major 코드 반주
      { time: "1:0:0", note: "D3", duration: "4n" },
      { time: "1:1:0", note: "A3", duration: "8n" },
      { time: "1:1:2", note: "D4", duration: "8n" },
      { time: "1:2:0", note: "F#4", duration: "8n" },
      { time: "1:2:2", note: "A3", duration: "8n" },
      { time: "1:3:0", note: "D4", duration: "8n" },
      { time: "1:3:2", note: "F#4", duration: "8n" },

      // 3마디: F#m 코드 반주
      { time: "2:0:0", note: "F#2", duration: "4n" },
      { time: "2:1:0", note: "C#3", duration: "8n" },
      { time: "2:1:2", note: "F#3", duration: "8n" },
      { time: "2:2:0", note: "A3", duration: "8n" },
      { time: "2:2:2", note: "C#3", duration: "8n" },
      { time: "2:3:0", note: "F#3", duration: "8n" },
      { time: "2:3:2", note: "A3", duration: "8n" },

      // 4마디: E Major 코드 반주
      { time: "3:0:0", note: "E2", duration: "4n" },
      { time: "3:1:0", note: "B2", duration: "8n" },
      { time: "3:1:2", note: "E3", duration: "8n" },
      { time: "3:2:0", note: "G#3", duration: "2n" }
    ];

    let isPlaying = false;
    const playBtn = document.getElementById("playBtn");
    const bars = document.querySelectorAll(".bar");

    // 비주얼라이저 애니메이션
    function animateVisualizer() {
      if (!isPlaying) {
        bars.forEach(bar => bar.style.height = "8px");
        return;
      }
      bars.forEach(bar => {
        const randomHeight = Math.floor(Math.random() * 35) + 8;
        bar.style.height = randomHeight + "px";
      });
      setTimeout(animateVisualizer, 100);
    }

    // 양손 파트를 통합하는 Part 생성
    const combinedEvents = [
      ...rightHand.map(e => ({ ...e, velocity: 0.9 })), // 멜로디는 강하게
      ...leftHand.map(e => ({ ...e, velocity: 0.6 }))   // 반주는 보다 부드럽게
    ];

    const part = new Tone.Part((time, event) => {
      synth.triggerAttackRelease(event.note, event.duration, time, event.velocity);
    }, combinedEvents);

    part.loop = true;
    part.loopEnd = "4:0:0";
    Tone.Transport.bpm.value = 112; // 경쾌하면서도 잔잔한 템포

    // 버튼 클릭 이벤트
    playBtn.addEventListener("click", async () => {
      await Tone.start();

      if (!isPlaying) {
        Tone.Transport.start();
        part.start(0);
        isPlaying = true;
        playBtn.innerText = "❚❚ 일시정지";
        animateVisualizer();
      } else {
        Tone.Transport.stop();
        isPlaying = false;
        playBtn.innerText = "▶ 연주 시작";
      }
    });
  </script>
</body>
</html>
